
      - name: Installer Capacitor
        run: |
          npm install --save @capacitor/core @capacitor/android --legacy-peer-deps
          npm install --save-dev @capacitor/cli --legacy-peer-deps

          npx cap --version
          test -f capacitor.config.json

      - name: Générer le projet Android (Capacitor)
        run: |
          rm -rf android

          npx cap add android

          command -v convert >/dev/null 2>&1 || {
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
          }

          bash scripts/make-android-icons.sh

          M=android/app/src/main/AndroidManifest.xml

          if grep -q 'android:allowBackup=' "$M"; then
            sed -i 's/android:allowBackup="[a-z]*"/android:allowBackup="false"/' "$M"
          else
            sed -i '0,/<application/s//<application android:allowBackup="false"/' "$M"
          fi

          sed -i 's/ android:fullBackupContent="[^"]*"//' "$M"

          test "$(grep -o 'android:allowBackup=' "$M" | wc -l)" = "1"

          npx cap sync android
          
