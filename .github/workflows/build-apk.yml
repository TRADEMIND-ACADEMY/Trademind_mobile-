name: Build Android APK (TradeMind Academy)

# Lancement MANUEL uniquement (onglet Actions > Build Android APK > Run workflow).
# Prérequis : variable de dépôt  API_BASE_URL  = https://VOTRE-SITE.netlify.app  (Settings > Secrets and variables > Actions > Variables)
# Aucun secret n'est nécessaire ni embarqué dans l'APK.
# ATTENTION : ce workflow n'a pas encore été exécuté (NON TESTÉ). Le premier lancement réel peut demander un ajustement.
on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier l'URL de l'API
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then echo "::error::Variable de dépôt API_BASE_URL manquante (ex. https://votre-site.netlify.app)"; exit 1; fi
          case "$API_BASE_URL" in https://*) ;; *) echo "::error::API_BASE_URL doit commencer par https://"; exit 1;; esac

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Contrôle des types
        run: npm run lint

      - name: Compiler l'application web (Vite)
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build

      - name: Générer le projet Android (Capacitor)
        run: |
          rm -rf android
          npx cap add android
          # Empêche la sauvegarde automatique Android du jeton de session
          sed -i 's/<application/<application android:allowBackup="false" android:fullBackupContent="false"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Construire l'APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeMind-Academy-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
